# ============================================================
# RelevanceFlow - Training Configuration
# ============================================================

training:
  random_seed: 42

  experiment_name: "relevanceflow"

  validation_strategy: "group_query"

  early_stopping_rounds: 50

  verbose: true

# ------------------------------------------------------------
# LightGBM
# ------------------------------------------------------------

lightgbm:
  objective: "lambdarank"

  metric:
    - "ndcg"

  ndcg_at:
    - 5
    - 10
    - 20

  boosting_type: "gbdt"

  n_estimators: 500

  learning_rate: 0.05

  num_leaves: 31

  max_depth: -1

  min_child_samples: 20

  subsample: 0.8

  colsample_bytree: 0.8

  reg_alpha: 0.0

  reg_lambda: 0.0

  random_state: 42

  n_jobs: -1
